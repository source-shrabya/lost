<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="student">
<main>
  <section id="join" class="join">
    <h1>Lost</h1>
    <p class="lede">Type the 4-letter code on your professor's screen.</p>
    <form id="joinForm">
      <input id="code" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Class code" required>
      <button class="primary big">Join class</button>
    </form>
    <p id="joinErr" class="note warn" role="alert"></p>
  </section>

  <section id="live" class="room" hidden>
    <header class="topline">
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">Waiting for class</span></span>
      <span class="note">Class <b id="classCode"></b></span>
    </header>

    <div class="main-col">
      <button class="lostbtn" id="lost"><span class="lost-main">I'm lost</span><span class="lost-sub">Tap, then keep listening</span></button>
      <p id="ack" class="ack" aria-live="polite"></p>

      <div class="tools">
        <button id="listen" class="tool" disabled>Listen to class</button>
        <button id="showT" class="tool" aria-expanded="false" aria-controls="tpanel" disabled>Show transcript</button>
      </div>
      <p id="listenNote" class="note center" aria-live="polite"></p>
      <audio id="relayAudio"></audio>
    </div>

    <div class="side-col">
      <aside id="help" class="side-card help" hidden aria-live="polite">
        <div class="side-head"><h2>Lost helper</h2><button id="closeHelp" class="quiet">Close</button></div>
        <div id="helpBody" class="help-body"></div>
      </aside>
      <div id="recent" class="side-card" hidden>
        <div class="side-head"><h2 id="recentTitle">The last 15 seconds</h2><button id="closeRecent" class="quiet">Close</button></div>
        <div id="recentLines" class="tlines"></div>
      </div>
      <div id="tpanel" class="side-card" hidden>
        <div class="side-head"><h2>Transcript</h2></div>
        <p class="note tip">Tap the line where you got lost, then tap I'm lost.</p>
        <div id="tlines" class="tlines"></div>
      </div>
    </div>
  </section>

  <section id="after" class="after" hidden>
    <h1>Today's class</h1>
    <div id="classSum"></div>
    <h2 class="after-h">Where you got lost</h2>
    <div id="catchups"></div>
  </section>
</main>
<script src="diagram.js"></script>
<script>
let id = null;
try { id = localStorage.getItem("lost-id"); } catch {}
// crypto.randomUUID only exists on https/localhost, and students load this page over plain http
if (!id) { id = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join(""); try { localStorage.setItem("lost-id", id); } catch {} }

const $ = (s) => document.querySelector(s);
const post = (url, data) => fetch(url, { method: "POST", body: JSON.stringify({ id, ...data }) }).then((r) => r.json());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (t) => { const s = Math.max(0, Math.round(t)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
let joinedCode = null; try { joinedCode = localStorage.getItem("lost-code"); } catch {}
let lastCatch = "", lastSum = "", lastLines = "", transcriptOpen = false, offline = false;
// The line under the button: a short message after a tap, otherwise what the phase calls for.
let ackOverride = "", phase = "waiting";
const PHASE_ACK = { waiting: "The button turns on when class starts.", live: "Nobody sees who tapped.", ended: "Your summary shows up here once your professor sends it." };
function paintAck() { $("#ack").textContent = offline ? "Reconnecting…" : ackOverride || PHASE_ACK[phase]; }
function flashAck(t, ms = 5000) { ackOverride = t; paintAck(); clearTimeout(window.ackT); window.ackT = setTimeout(() => { ackOverride = ""; paintAck(); }, ms); }

$("#joinForm").onsubmit = async (e) => {
  e.preventDefault();
  const code = $("#code").value.trim().toUpperCase();
  const r = await post("/api/join", { code });
  if (!r.ok) { $("#joinErr").textContent = r.error; return; }
  joinedCode = code; try { localStorage.setItem("lost-code", code); } catch {}
};

let selLine = null, selText = "";
const DEFAULT_SUB = "Tap, then keep listening";
function setSel(i, text) {
  selLine = i; selText = text || "";
  if (!$("#lost").classList.contains("marked")) $("#lost .lost-sub").textContent = selLine === null ? DEFAULT_SUB : `At "${selText.length > 40 ? selText.slice(0, 40) + "…" : selText}"`;
  $("#lost").classList.toggle("pointing", selLine !== null);
  lastLines = ""; if (lastState) render(lastState);
}

function showRecent(lines, pointed) {
  $("#recentTitle").textContent = pointed ? "Leading up to that line" : "The last 15 seconds";
  $("#recentLines").innerHTML = lines.length ? lines.map((l) => `<p><time>${fmt(l.t)}</time>${esc(l.text)}</p>`).join("") : `<p class="note">Nothing was transcribed yet. Your summary after class will cover it.</p>`;
  $("#recent").hidden = false;
}
$("#closeRecent").onclick = () => ($("#recent").hidden = true);

$("#lost").onclick = async () => {
  const pointed = selLine !== null;
  const r = await post("/api/tap", pointed ? { line: selLine } : {});
  setSel(null);
  navigator.vibrate?.(40);
  if (!r.counted && r.reason) { flashAck(r.reason); return; }
  if (r.helpLine != null) { $("#recent").hidden = true; openHelp(r.helpLine, r.sentence); }
  else if (r.recent) showRecent(r.recent, pointed);
  const others = r.others;
  // The button itself confirms the tap for a few seconds, then goes back to normal.
  const b = $("#lost"); b.classList.add("marked");
  b.querySelector(".lost-main").textContent = r.counted ? "Marked" : "Already marked";
  b.querySelector(".lost-sub").textContent = others ? `You and ${others} other${others === 1 ? "" : "s"}` : "Keep listening";
  flashAck(pointed ? "Marked that line. Your professor sees it." : "You'll get a summary of this part after class.");
  clearTimeout(window.btnT); window.btnT = setTimeout(() => {
    b.classList.remove("marked");
    b.querySelector(".lost-main").textContent = "I'm lost";
    b.querySelector(".lost-sub").textContent = DEFAULT_SUB;
  }, 5000);
};

// ---------- the helper that pops up after a tap ----------
// The tap has already reached the professor. The helper only offers an explanation on top.
let helpLine = null, helpSentence = "";
const quote = () => `<blockquote class="help-quote">"${esc(helpSentence)}"</blockquote>`;
function setHelp(html) {
  $("#helpBody").innerHTML = html;
  $("#help").hidden = false;
  if (window.innerWidth < 900) $("#help").scrollIntoView({ behavior: "smooth", block: "start" });
}
function openHelp(i, sentence) {
  helpLine = i; helpSentence = sentence;
  setHelp(`<p class="help-ask">Do you need my help with this?</p>${quote()}
    <div class="help-actions"><button class="primary" data-h="explain">Explain it</button><button data-h="prof">Just tell my professor</button></div>`);
}
async function explainIt() {
  setHelp(`${quote()}<p class="note help-wait">Reading what your professor just said…</p>`);
  const line = helpLine;
  const r = await post("/api/help", { line }).catch(() => ({ ok: false, error: "No connection." }));
  if (line !== helpLine) return; // the student tapped somewhere else meanwhile
  if (!r.ok) { setHelp(`${quote()}<p class="note">${esc(r.error)} Your professor still got your tap.</p>`); return; }
  setHelp(`${quote()}
    <h3 class="help-h">What it means</h3><p>${esc(r.means)}</p>
    <h3 class="help-h">How it fits</h3><p>${esc(r.context)}</p>
    ${window.drawDiagram(r.diagram)}
    <div id="helpVote"><p class="help-ask">Did that help?</p>
      <div class="help-actions"><button data-h="yes">Yes</button><button data-h="no">No, still lost</button></div></div>
    <form id="helpAsk" class="help-form" hidden><label for="helpQ" class="note">Ask a follow-up</label>
      <div class="help-row"><input id="helpQ" maxlength="300" autocomplete="off" placeholder="What does … mean?"><button class="primary">Ask</button></div></form>
    <div id="helpMore"></div>`);
}
$("#helpBody").onclick = async (e) => {
  const b = e.target.closest("button[data-h]"); if (!b) return;
  const h = b.dataset.h;
  if (h === "explain") explainIt();
  if (h === "prof") { setHelp(`<p>Sent. Your professor sees this spot, and your summary after class will cover it.</p>`); setTimeout(() => ($("#help").hidden = true), 4000); }
  if (h === "yes" || h === "no") {
    post("/api/help-feedback", { line: helpLine, helped: h === "yes" });
    $("#helpVote").innerHTML = `<p class="note">${h === "yes" ? "Good. Your professor will see that it helped." : "Got it. Your professor will see this spot is still unclear."}</p>`;
    $("#helpAsk").hidden = false;
  }
};
$("#helpBody").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("#helpQ").value.trim(); if (!q) return;
  const more = $("#helpMore"), btn = e.target.querySelector("button");
  btn.disabled = true;
  more.insertAdjacentHTML("beforeend", `<p class="help-q">${esc(q)}</p><p class="note help-wait">Thinking…</p>`);
  $("#helpQ").value = "";
  const r = await post("/api/help-followup", { line: helpLine, question: q }).catch(() => ({ ok: false, error: "No connection." }));
  more.querySelector(".help-wait")?.remove();
  more.insertAdjacentHTML("beforeend", r.ok ? `<p>${esc(r.answer)}</p>${window.drawDiagram(r.diagram)}` : `<p class="note">${esc(r.error)}</p>`);
  btn.disabled = false;
});
$("#closeHelp").onclick = () => ($("#help").hidden = true);

$("#showT").onclick = () => {
  transcriptOpen = !transcriptOpen;
  $("#tpanel").hidden = !transcriptOpen;
  $("#showT").textContent = transcriptOpen ? "Hide transcript" : "Show transcript";
  $("#showT").setAttribute("aria-expanded", transcriptOpen);
  $("#showT").classList.toggle("on", transcriptOpen);
  lastLines = ""; // redraw on next check-in
  if (transcriptOpen) { const box = $("#tlines"); box.scrollTop = box.scrollHeight; }
  else if (selLine !== null) setSel(null);
};

function render(s) {
  // rejoin automatically after a server restart or new class (code changes)
  if (!s.joined && joinedCode && joinedCode === s.code) post("/api/join", { code: joinedCode });
  const joined = s.joined, done = joined && s.phase === "ended" && s.sent;
  $("#join").hidden = joined;
  $("#live").hidden = !joined || done;
  $("#after").hidden = !done;
  $("#classCode").textContent = s.code;

  const live = s.phase === "live";
  $("#lost").disabled = !live;
  $("#showT").disabled = !live;
  $("#dot").className = "dot " + s.phase;
  $("#statusText").textContent = { waiting: "Waiting for class to start", live: "Class is live", ended: "Class is over" }[s.phase];
  phase = s.phase; paintAck();
  if (!live && transcriptOpen) $("#showT").click();
  if (!live) { if (selLine !== null) setSel(null); $("#recent").hidden = true; }

  if (transcriptOpen && s.lines) {
    const key = s.lines.length + ":" + (s.lines.at(-1)?.text || "") + ":" + selLine + ":" + s.lines.filter((l) => l.mine).length;
    if (key !== lastLines) {
      lastLines = key;
      const box = $("#tlines");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.innerHTML = s.lines.length ? s.lines.map((l) => `<button class="tline${l.i === selLine ? " sel" : ""}${l.mine ? " mine" : ""}" data-i="${l.i}" aria-pressed="${l.i === selLine}"><time>${fmt(l.t)}</time>${esc(l.text)}</button>`).join("") : `<p class="note">Nothing yet. Words show up here as your professor talks.</p>`;
      if (atBottom) box.scrollTop = box.scrollHeight;
    }
  }

  if (s.summary || s.transcript) {
    const key = JSON.stringify([s.summary, s.transcript?.length]);
    if (key !== lastSum) {
      lastSum = key;
      $("#classSum").innerHTML = s.summary
        ? `<div class="tldr"><span>TL;DR</span><p>${esc(s.summary.tldr || s.summary.overview || "")}</p></div>` +
          window.drawDiagram(s.summary.diagram) +
          (s.summary.patterns?.length ? `<h2 class="after-h">Where the class got stuck</h2>` + s.summary.patterns.map((p) => `<article class="sumpoint"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></article>`).join("") : "") +
          `<h2 class="after-h">Topic by topic</h2>` + s.summary.points.map((p) => `<article class="sumpoint"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></article>`).join("")
        : `<details class="tdump"><summary>Everything your professor said (transcript)</summary>${s.transcript.map((l) => `<p><time>${fmt(l.t)}</time>${esc(l.text)}</p>`).join("") || "<p class='note'>Nothing was transcribed.</p>"}</details>`;
    }
  }
  if (s.catchup) {
    const key = JSON.stringify(s.catchup.map((m) => [m.index, m.explanation]));
    if (key === lastCatch) return; lastCatch = key;
    $("#catchups").innerHTML = s.catchup.length ? s.catchup.map((m) => `
      <article class="catch">
        <h2><span class="at">${m.at}</span>${m.topic ? esc(m.topic) : "Where you got lost"}</h2>
        ${m.explanation ? `<p>${esc(m.explanation)}</p>` : ""}
        <details ${m.explanation ? "" : "open"}><summary>What your professor said</summary><blockquote class="said">${esc(m.said)}</blockquote></details>
        ${m.question ? `<details><summary>Check yourself: ${esc(m.question)}</summary><p>${esc(m.answer)}</p></details>` : ""}
        <div class="controls-row">
          <button data-i="${m.index}" data-k="still">Still confused</button>
          <button data-i="${m.index}" data-k="unhelpful" class="quiet">This didn't help</button>
        </div>
      </article>`).join("") : `<p class="empty">You didn't tap "I'm lost" in this class.</p>`;
  }
}

$("#tlines").onclick = (e) => {
  const b = e.target.closest("button.tline"); if (!b) return;
  const i = Number(b.dataset.i);
  if (i === selLine) setSel(null);
  else setSel(i, b.lastChild.textContent);
};

$("#catchups").onclick = async (e) => {
  const b = e.target.closest("button[data-i]"); if (!b) return;
  await post("/api/feedback", { index: Number(b.dataset.i), kind: b.dataset.k === "unhelpful" ? "unhelpful" : "still" });
  b.disabled = true; b.textContent = "Sent to your professor";
};

// ---------- professor's sound through the Lost server ----------
// The professor's page uploads its mic in 1-second pieces; the student plays them back to back.
// Off until the student taps Listen, since students sitting in the room don't need it.
let wantSound = false, relayPlayer = null;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const setListenNote = (t) => { if ($("#listenNote").textContent !== t) $("#listenNote").textContent = t; };

$("#listen").onclick = () => {
  wantSound = !wantSound;
  if (!wantSound) stopRelayPlayer();
  else if (lastState?.audio) startRelayPlayer(lastState.audio);
  paintListen(lastState);
};

function paintListen(s) {
  const b = $("#listen");
  const available = !!(s && s.joined && s.phase === "live" && s.audio);
  b.disabled = !available;
  b.classList.toggle("on", wantSound && available);
  b.textContent = wantSound && available ? "Stop listening" : "Listen to class";
  if (!s || s.phase !== "live") setListenNote("");
  else if (!s.audio) setListenNote("Your professor's mic isn't shared right now.");
  else if (wantSound) setListenNote("Listening. About 2 seconds behind the room.");
  else setListenNote("In the room? You don't need to listen here.");
}

let lastState = null;
function handleAudio(s) {
  lastState = s;
  if (!s.joined || s.phase !== "live" || !s.audio) stopRelayPlayer();
  else if (wantSound) {
    if (!relayPlayer || relayPlayer.id !== s.audio.id) startRelayPlayer(s.audio);
    else relayPlayer.latest = s.audio.seq;
  }
  paintListen(s);
}

function startRelayPlayer(a) {
  stopRelayPlayer();
  if (!window.MediaSource || !MediaSource.isTypeSupported('audio/webm; codecs="opus"')) { setListenNote("This browser can't play the sound. Try Chrome."); return; }
  const el = $("#relayAudio"), ms = new MediaSource();
  const p = { id: a.id, latest: a.seq, next: 1, sb: null, el, url: URL.createObjectURL(ms) };
  relayPlayer = p;
  el.src = p.url;
  ms.addEventListener("sourceopen", async () => {
    p.sb = ms.addSourceBuffer('audio/webm; codecs="opus"');
    p.sb.mode = "sequence"; // play pieces back to back even when we skip some
    if (!(await appendPiece(p, 0))) return;
    p.next = Math.max(1, p.latest); // start near "now", not at the beginning
    pump(p);
  }, { once: true });
  el.play().catch(() => {}); // started from the Listen tap, so the browser allows sound
}

async function appendPiece(p, n) {
  try {
    const r = await fetch(`/api/audio?id=${id}&seq=${n}`, { cache: "no-store" });
    if (!r.ok || p !== relayPlayer) return false;
    const buf = await r.arrayBuffer();
    if (p !== relayPlayer) return false;
    await new Promise((done, fail) => { p.sb.addEventListener("updateend", done, { once: true }); p.sb.addEventListener("error", fail, { once: true }); p.sb.appendBuffer(buf); });
    return true;
  } catch { return false; }
}

async function pump(p) {
  while (p === relayPlayer) {
    if (p.next < p.latest - 20) p.next = p.latest; // fell far behind (tab was asleep): jump to now
    if (p.next <= p.latest) { await appendPiece(p, p.next); p.next++; }
    else await sleep(250);
    const b = p.el.buffered;
    if (b.length && b.end(b.length - 1) - p.el.currentTime > 3.5) p.el.currentTime = b.end(b.length - 1) - 0.8; // stay close to live
    if (p.el.paused && b.length) p.el.play().catch(() => {});
  }
}

function stopRelayPlayer() {
  if (!relayPlayer) return;
  const p = relayPlayer; relayPlayer = null;
  p.el.pause(); p.el.removeAttribute("src"); p.el.load(); URL.revokeObjectURL(p.url);
}

// Check in with the server every second. Simple polling works through any proxy or tunnel.
async function poll() {
  try {
    const r = await fetch(`/api/poll?role=student&id=${id}${transcriptOpen ? "&lines=1" : ""}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const { state } = await r.json();
    offline = false;
    render(state);
    handleAudio(state);
  } catch { offline = true; paintAck(); }
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
