<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="student">
  <section id="join">
    <h1>Lost</h1>
    <p class="muted">Type the code on your professor's screen.</p>
    <form id="joinForm" class="row">
      <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="Class code" required>
      <button class="primary">Join</button>
    </form>
    <p id="joinErr" role="alert" style="color:var(--accent)"></p>
  </section>

  <section id="live" hidden>
    <div id="videoBox" hidden style="position:relative">
      <video id="video" autoplay playsinline style="width:100%;border-radius:12px;background:#000"></video>
      <button id="unmute" class="primary" hidden style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)">Tap for sound</button>
    </div>
    <p class="muted" style="text-align:center" id="liveNote">Tap when you get lost. Nobody sees who tapped.</p>
    <button class="lostbtn" id="lost">I'm lost</button>
    <p id="ack" aria-live="polite"></p>
  </section>

  <section id="after" hidden>
    <h1>Your lost moments</h1>
    <div id="catchups"></div>
  </section>
</main>
<script>
let id = null;
try { id = localStorage.getItem("lost-id"); } catch {}
// crypto.randomUUID only exists on https/localhost, and students load this page over plain http
if (!id) { id = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join(""); try { localStorage.setItem("lost-id", id); } catch {} }

const $ = (s) => document.querySelector(s);
const post = (url, data) => fetch(url, { method: "POST", body: JSON.stringify({ id, ...data }) }).then((r) => r.json());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let joinedCode = null; try { joinedCode = localStorage.getItem("lost-code"); } catch {}
let lastCatch = "";

$("#joinForm").onsubmit = async (e) => {
  e.preventDefault();
  const code = $("#code").value.trim().toUpperCase();
  const r = await post("/api/join", { code });
  if (!r.ok) { $("#joinErr").textContent = r.error; return; }
  joinedCode = code; try { localStorage.setItem("lost-code", code); } catch {}
};

$("#lost").onclick = async () => {
  const r = await post("/api/tap");
  navigator.vibrate?.(40);
  if (!r.counted && r.reason) { $("#ack").textContent = r.reason; return; }
  const others = r.others;
  $("#ack").textContent = (r.counted ? "Marked. " : "Already marked. ") +
    (others ? `You and ${others} other${others === 1 ? "" : "s"}. ` : "") + "Keep listening, you'll get a catch-up after class.";
  clearTimeout(window.ackT); window.ackT = setTimeout(() => ($("#ack").textContent = ""), 6000);
};

function render(s) {
  // rejoin automatically after a server restart or new class (code changes)
  if (!s.joined && joinedCode && joinedCode === s.code) post("/api/join", { code: joinedCode });
  const joined = s.joined;
  $("#join").hidden = joined;
  $("#live").hidden = !joined || s.phase === "ended" && s.sent;
  $("#after").hidden = !(joined && s.phase === "ended" && s.sent);
  $("#lost").disabled = s.phase !== "live";
  $("#liveNote").textContent = s.phase === "waiting" ? "Waiting for class to start." :
    s.phase === "ended" ? "Class is over. Your catch-up is on its way." : "Tap when you get lost. Nobody sees who tapped.";
  if (s.catchup) {
    const key = JSON.stringify(s.catchup.map((m) => [m.index, m.explanation]));
    if (key === lastCatch) return; lastCatch = key;
    $("#catchups").innerHTML = s.catchup.length ? s.catchup.map((m) => `
      <article class="card catch">
        <p class="muted">Around ${m.at}${m.topic ? " · " + esc(m.topic) : ""}</p>
        ${m.explanation ? `<p>${esc(m.explanation)}</p>` : ""}
        <details ${m.explanation ? "" : "open"}><summary>What the professor said</summary><p class="said">${esc(m.said)}</p></details>
        ${m.question ? `<details><summary>Practice: ${esc(m.question)}</summary><p>${esc(m.answer)}</p></details>` : ""}
        <div class="row" style="margin-top:12px">
          <button data-i="${m.index}" data-k="still">Still confused</button>
          <button data-i="${m.index}" data-k="unhelpful">This didn't help</button>
        </div>
      </article>`).join("") : `<p class="muted">You didn't tap today. Nothing to catch up on.</p>`;
  }
}

$("#catchups").onclick = async (e) => {
  const b = e.target.closest("button[data-i]"); if (!b) return;
  await post("/api/feedback", { index: Number(b.dataset.i), kind: b.dataset.k === "unhelpful" ? "unhelpful" : "still" });
  b.disabled = true; b.textContent = "Sent to your professor";
};

// ---------- professor's camera + mic (WebRTC) ----------
let pc = null;
const signal = (data) => post("/api/signal", { from: id, to: "prof", data });

async function onOffer(data) {
  pc?.close();
  pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  const call = data.call;
  pc.call = call; pc.pending = [];
  pc.onicecandidate = (e) => e.candidate && signal({ call, candidate: e.candidate });
  pc.ontrack = (e) => {
    const v = $("#video");
    if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0];
    $("#videoBox").hidden = false;
    // sound-only call: keep a slim bar instead of a big black box
    const hasVideo = e.streams[0].getVideoTracks().length > 0;
    v.style.height = hasVideo ? "" : "48px";
    $("#liveNote").dataset.sound = hasVideo ? "" : "You're hearing your professor live.";
    v.muted = false;
    // Browsers block sound until the page has been clicked; offer a button if that happens.
    v.play().catch(() => { v.muted = true; v.play(); $("#unmute").hidden = false; });
  };
  pc.onconnectionstatechange = () => { if (["closed", "failed"].includes(pc.connectionState)) $("#videoBox").hidden = true; };
  const mine = pc;
  await mine.setRemoteDescription(data.sdp);
  for (const c of mine.pending.splice(0)) mine.addIceCandidate(c).catch(() => {});
  await mine.setLocalDescription(await mine.createAnswer());
  if (pc !== mine) return; // a newer call replaced this one
  signal({ call, sdp: pc.localDescription });
}
$("#unmute").onclick = () => { const v = $("#video"); v.muted = false; v.play(); $("#unmute").hidden = true; };

async function onSignal({ data }) {
  if (data.sdp) await onOffer(data);
  else if (data.candidate && pc && pc.call === data.call) {
    if (pc.remoteDescription) pc.addIceCandidate(data.candidate).catch(() => {});
    else pc.pending.push(data.candidate);
  }
}

// Check in with the server every second. Simple polling works through any proxy or tunnel.
let saidHello = false, offline = false;
async function poll() {
  try {
    const r = await fetch(`/api/poll?role=student&id=${id}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const { state, signals } = await r.json();
    if (offline) { offline = false; $("#ack").textContent = ""; }
    render(state);
    // after a reload, ask the professor's page to restart the video call
    if (state.joined && !saidHello) { saidHello = true; signal({ hello: true }); }
    for (const s of signals) await onSignal(s);
  } catch { offline = true; $("#ack").textContent = "Reconnecting…"; }
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
